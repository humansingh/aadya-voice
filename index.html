<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aadya — Ask about public services in your language</title>
<meta name="theme-color" content="#123d31" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/product.css" />
<style>
  :root {
    --paper: #f3f0e7;
    --paper-deep: #e9e4d7;
    --surface: #fffdf8;
    --surface-2: #f8f5ed;
    --line: rgba(24, 54, 45, .14);
    --line-strong: rgba(24, 54, 45, .24);
    --ink: #18362e;
    --muted: #718079;
    --forest: #123d31;
    --forest-2: #0a2c23;
    --leaf: #2f845e;
    --mint: #cfe9d8;
    --mint-soft: #e7f4eb;
    --sun: #f2bd55;
    --sun-soft: #faedc9;
    --coral: #d96d5b;
    --coral-soft: #f7ded9;
    --blue: #5d8fb4;
    --blue-soft: #e1ecf3;
    --radius-xl: 30px;
    --radius-lg: 23px;
    --radius-md: 17px;
    --sidebar-w: 296px;
    --shadow: 0 28px 70px rgba(25, 49, 42, .12);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%; height: 100%;
    color: var(--ink);
    background: var(--paper);
    font-family: "DM Sans", "Noto Sans Devanagari", "Noto Sans Kannada", "Noto Sans Tamil", "Noto Sans Bengali", "Noto Sans Telugu", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none; opacity: .22; z-index: 90;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.035'/%3E%3C/svg%3E");
  }
  button, input, textarea { font: inherit; }
  button { cursor: pointer; }
  ::selection { background: var(--sun); color: var(--forest-2); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  .i18n-dual { display: flex; flex-direction: column; gap: 2px; text-align: left; }
  .en-gloss-line, .en-gloss { color: var(--muted); font-weight: 500; font-size: .76em; }
  .en-gloss { margin-left: 5px; }

  /* ---------- Application shell ---------- */
  .shell {
    width: 100%;
    height: 100dvh;
    margin: 0;
    padding: 0;
    background: var(--surface-2);
  }
  #root {
    height: 100%; min-height: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
    border: 0;
    border-radius: 0;
    background: var(--surface-2);
    box-shadow: none;
    position: relative;
  }
  .body-row { flex: 1 1 auto; display: flex; min-height: 0; overflow: hidden; position: relative; }

  header {
    flex: 0 0 74px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 253, 248, .88);
    backdrop-filter: blur(18px) saturate(130%);
    -webkit-backdrop-filter: blur(18px) saturate(130%);
    position: relative; z-index: 25;
  }
  .header-left, .header-actions { display: flex; align-items: center; gap: 10px; }
  .wordmark { border: 0; background: none; color: inherit; padding: 0; display: flex; align-items: center; gap: 11px; text-align: left; }
  .wordmark-icon { width: 39px; height: 39px; border-radius: 50%; background: var(--forest); color: #fff; display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  .wordmark-icon svg { width: 21px; height: 21px; }
  .wordmark-copy { display: flex; flex-direction: column; gap: 1px; }
  .wordmark-text { color: var(--forest); font-family: "Manrope", sans-serif; font-size: 16px; font-weight: 700; line-height: 1.1; letter-spacing: -.035em; }
  .wordmark-sub { color: var(--muted); font-size: 10px; line-height: 1.1; }
  .history-badge, .demo-badge { margin-left: 2px; padding: 4px 8px; border-radius: 999px; font-size: 9px; line-height: 1; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  .history-badge { background: var(--mint-soft); color: var(--leaf); }
  .demo-badge { background: var(--sun-soft); color: #855d16; border: 1px solid rgba(133,93,22,.18); }
  .network-pill { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; font-weight: 700; padding: 8px 10px; border-right: 1px solid var(--line); margin-right: 2px; }
  .network-pill i { width: 7px; height: 7px; border-radius: 50%; background: #3aa66f; box-shadow: 0 0 0 5px rgba(58,166,111,.10); }
  .network-pill.offline { color: #a05548; }
  .network-pill.offline i { background: var(--coral); box-shadow: 0 0 0 5px rgba(217,109,91,.10); }
  .hamburger-btn { display: none; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); align-items: center; justify-content: center; }
  .hamburger-btn svg { width: 18px; height: 18px; }
  .lang-pill, .voice-pill, .mode-pill, .avatar-btn, .account-trigger, .landing-link { min-height: 42px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .landing-link { border-radius: 999px; padding: 0 14px; gap: 7px; font-size: 12px; text-decoration: none; color: var(--leaf); border-color: rgba(47,132,94,.28); background: var(--mint-soft); }
  .landing-link:hover { background: var(--mint); }
  .landing-link svg { width: 13px; height: 13px; }
  .lang-pill { border-radius: 999px; padding: 0 14px; gap: 7px; font-size: 12px; }
  .lang-pill svg { width: 12px; opacity: .6; }
  .voice-pill{border-radius:999px;padding:0 12px;gap:6px;font-size:11px;white-space:nowrap}.voice-pill svg{width:15px;height:15px;color:var(--leaf)}
  .mode-pill { width:96px;border-radius:999px;padding:0 12px;gap:7px;font-size:10px;white-space:nowrap}.mode-pill i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--mint-soft);font-style:normal;font-size:10px}.mode-pill:hover{border-color:var(--line-strong)}
  .avatar-btn { width: 42px; border-radius: 50%; padding: 0; background: var(--mint-soft); color: var(--forest); font-size: 13px; }
  .account-trigger { border-radius:999px; padding:0 11px 0 6px; gap:7px; font-size:11px; white-space:nowrap; }
  .account-trigger .account-trigger-avatar { width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--mint-soft);color:var(--forest);font-size:10px;font-weight:800; }
  .account-trigger.guest .account-trigger-avatar { background:var(--forest);color:#fff; }
  .account-trigger svg { width:12px;height:12px;color:var(--muted); }
  .lang-pill:hover, .voice-pill:hover, .avatar-btn:hover, .account-trigger:hover, .hamburger-btn:hover { border-color: var(--line-strong); }

  /* ---------- Sidebar ---------- */
  .sidebar {
    flex: 0 0 var(--sidebar-w); width: var(--sidebar-w);
    background: var(--paper-deep);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    padding: 17px 14px 14px;
    overflow: hidden;
    scrollbar-width: thin;
    scrollbar-color: rgba(24,54,45,.18) transparent;
  }
  .new-chat-btn {
    width: 100%; min-height: 49px;
    border: 0; border-radius: 16px;
    padding: 0 15px;
    background: var(--forest); color: #fff;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 13px; font-weight: 700;
    box-shadow: 0 12px 28px rgba(18,61,49,.18);
    transition: transform .18s ease, background .18s ease;
  }
  .new-chat-btn:hover { background: var(--forest-2); }
  .new-chat-btn .new-chat-left { display: flex; align-items: center; gap: 9px; }
  .new-chat-btn svg { width: 16px; height: 16px; }
  .sidebar-scroll { min-height:0; flex:1 1 auto; overflow-y:auto; display:flex; flex-direction:column; gap:15px; padding-right:2px; scrollbar-width:thin; scrollbar-color:rgba(24,54,45,.18) transparent; }
  .sidebar-section { display: flex; flex-direction: column; gap: 4px; }
  .sidebar-heading { padding: 0 7px 4px; color: #7f8a84; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .14em; }
  .sidebar-item {
    width: 100%; min-height: 40px;
    border: 0; border-radius: 12px;
    padding: 8px 9px;
    background: transparent; color: #43574f;
    display: flex; align-items: center; gap: 10px;
    text-align: left; font-size: 12.5px; font-weight: 600;
    transition: background .16s ease, color .16s ease;
  }
  .sidebar-item:hover, .sidebar-item.active { background: rgba(255,255,255,.64); color: var(--forest); }
  .sidebar-item svg { width: 16px; height: 16px; flex: none; color: var(--leaf); }
  .sidebar-item .item-arrow { margin-left: auto; width: 12px; color: var(--muted); opacity: .48; }
  .session-item { width: 100%; border: 0; border-radius: 12px; padding: 9px 10px; background: transparent; color: inherit; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; transition: .16s ease; }
  .session-item:hover, .session-item.active { background: rgba(255,255,255,.64); }
  .session-q { width: 100%; color: #3e524a; font-size: 11.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-meta { color: #87918c; font-size: 9.5px; }
  .sidebar-spacer { flex: 1 1 auto; min-height: 14px; }
  .sidebar-account { flex:none; padding-top: 11px; margin-top:11px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; background:var(--paper-deep); position:sticky; bottom:0; z-index:2; }
  .sidebar-backdrop { display: none; position: absolute; inset: 0; z-index: 35; background: rgba(10,44,35,.34); backdrop-filter: blur(4px); }

  /* ---------- Main surface ---------- */
  .main-column { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; background: var(--surface-2); position: relative; }
  main { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 28px 28px 12px; display: flex; flex-direction: column; }
  main::-webkit-scrollbar { width: 6px; }
  main::-webkit-scrollbar-thumb { background: rgba(24,54,45,.12); border-radius: 9px; }
  .conversation-inner { width: min(840px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 25px; flex: 1 0 auto; padding: 4px 0 28px; }

  /* ---------- Voice-first welcome ---------- */
  .welcome-empty-state { flex: 1; width: min(1040px, 100%); margin: auto; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 18px 0 24px; }
  .first-mic-screen { flex: 1; min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; position: relative; padding: 20px; }
  .mic-focus { display: flex; flex-direction: column; align-items: center; gap: 52px; }
  .first-mic-button { width: clamp(150px, 30vw, 230px); aspect-ratio: 1; border: 0; border-radius: 50%; display: grid; place-items: center; color: var(--forest); background: radial-gradient(circle at 35% 28%, #f8d990, var(--sun) 62%, #d99a35); box-shadow: 0 28px 65px rgba(18,61,49,.22), 0 0 0 22px rgba(47,132,94,.08); animation: micBreathe 3.6s ease-in-out infinite; }
  .first-mic-button:hover, .first-mic-button:focus-visible { animation-play-state: paused; }
  @keyframes micBreathe {
    0%, 100% { transform: scale(1); box-shadow: 0 28px 65px rgba(18,61,49,.22), 0 0 0 22px rgba(47,132,94,.08); }
    50% { transform: scale(1.025); box-shadow: 0 28px 65px rgba(18,61,49,.24), 0 0 0 28px rgba(47,132,94,.05); }
  }
  @media (prefers-reduced-motion: reduce) { .first-mic-button { animation: none; } }
  .first-mic-button svg { width: 42%; height: 42%; }
  .first-mic-button:focus-visible { outline: 5px solid var(--forest); outline-offset: 8px; }
  .voice-welcome {
    min-height: 460px;
    border-radius: var(--radius-xl);
    color: #f5fff8;
    background:
      radial-gradient(circle at 82% 13%, rgba(242,189,85,.20), transparent 17rem),
      radial-gradient(circle at 16% 82%, rgba(207,233,216,.12), transparent 20rem),
      linear-gradient(137deg, #164f3d, #0b3026 72%);
    display: grid; grid-template-columns: 1.02fr .98fr; gap: 24px;
    overflow: hidden; position: relative;
    box-shadow: 0 26px 65px rgba(18,61,49,.18);
  }
  .voice-welcome::before { content: ""; position: absolute; width: 480px; height: 480px; border-radius: 50%; right: -220px; top: -250px; border: 1px solid rgba(255,255,255,.10); box-shadow: 0 0 0 65px rgba(255,255,255,.025), 0 0 0 130px rgba(255,255,255,.016); }
  .welcome-copy { padding: 48px 0 46px 48px; display: flex; flex-direction: column; align-items: flex-start; position: relative; z-index: 2; }
  .welcome-kicker { display: flex; align-items: center; gap: 8px; color: #bcd8c7; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .15em; }
  .welcome-kicker i { width: 7px; height: 7px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 0 6px rgba(242,189,85,.10); }
  .welcome-copy h1 { margin: 20px 0 16px; font-family: "Manrope", sans-serif; font-size: clamp(37px, 4.5vw, 58px); line-height: 1.02; letter-spacing: -.06em; font-weight: 600; text-wrap: balance; }
  .greeting-native { color: #d4e8dc; font-size: 14px; line-height: 1.5; max-width: 48ch; }
  .greeting-en { color: #9ebbad; font-size: 11px; margin-top: 4px; max-width: 48ch; }
  .empty-mic-launch { margin-top: 26px; border: 0; border-radius: 999px; background: #fffdf8; color: var(--forest); min-height: 54px; padding: 6px 18px 6px 7px; display: flex; align-items: center; gap: 11px; font-size: 12px; font-weight: 800; box-shadow: 0 16px 32px rgba(0,0,0,.18); }
  .empty-mic-icon { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--sun); }
  .empty-mic-icon svg { width: 18px; height: 18px; }
  .welcome-trust { margin-top: auto; padding-top: 28px; display: flex; align-items: center; gap: 9px; color: #91b0a1; font-size: 10px; }
  .welcome-trust svg { width: 16px; flex: none; color: #b7d9c5; }
  .welcome-orb-wrap { position: relative; display: grid; place-items: center; min-width: 0; }
  .welcome-orb { width: min(340px, 76%); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; position: relative; background: radial-gradient(circle, rgba(207,233,216,.22) 0 24%, rgba(207,233,216,.07) 25% 49%, transparent 50%); }
  .welcome-orb::before, .welcome-orb::after { content:""; position:absolute; border-radius:50%; border:1px solid rgba(230,248,236,.17); animation: orbBreath 4.8s ease-in-out infinite; }
  .welcome-orb::before { inset: 5%; }
  .welcome-orb::after { inset: 20%; animation-delay: -2.4s; }
  @keyframes orbBreath { 0%,100% { transform: scale(.95); opacity:.55; } 50% { transform: scale(1.04); opacity:1; } }
  .welcome-orb-core { width: 116px; height: 116px; border-radius: 50%; display: grid; place-items: center; color: var(--forest); background: radial-gradient(circle at 35% 28%, #f7d58f, #efb94c 62%, #c9822f); box-shadow: 0 28px 60px rgba(0,0,0,.28), inset 0 2px 2px rgba(255,255,255,.48); }
  .welcome-orb-core svg { width: 42px; height: 42px; }
  .orbit-label { position: absolute; border: 1px solid rgba(255,255,255,.17); background: rgba(255,255,255,.09); backdrop-filter: blur(8px); color: #d3e9dc; border-radius: 999px; padding: 8px 11px; font-size: 9px; font-weight: 700; }
  .orbit-label.one { left: 0; top: 24%; }
  .orbit-label.two { right: 2%; top: 15%; }
  .orbit-label.three { right: 0; bottom: 20%; }
  .starter-section { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: stretch; }
  .starter-label { border: 1px solid var(--line); border-radius: 20px; background: var(--surface); padding: 17px; display: flex; flex-direction: column; justify-content: space-between; color: var(--muted); font-size: 10px; line-height: 1.4; }
  .starter-label b { color: var(--forest); font-family: "Manrope", sans-serif; font-size: 15px; letter-spacing: -.025em; }
  .empty-chip-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .empty-chip-grid .chip { min-height: 96px; border-radius: 20px; padding: 15px; background: var(--surface); align-items: flex-start; justify-content: space-between; white-space: normal; font-size: 11px; line-height: 1.35; }
  .empty-chip-grid .chip::after { content: "↗"; align-self: flex-end; color: var(--leaf); font-size: 15px; }

  /* ---------- Conversation turns ---------- */
  .row { display: flex; width: 100%; animation: turnIn .36s cubic-bezier(.2,.75,.25,1) both; }
  @keyframes turnIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .row.user { justify-content: flex-end; }
  .row.agent { justify-content: stretch; }
  .user-turn { width: min(650px, 90%); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .turn-meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 9px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; padding-right: 4px; }
  .turn-meta i { width: 5px; height: 5px; border-radius: 50%; background: var(--sun); }
  .bubble-user { max-width: 100%; border-radius: 22px 22px 7px 22px; background: var(--forest); color: #fff; padding: 14px 18px; font-size: 15px; line-height: 1.48; box-shadow: 0 12px 26px rgba(18,61,49,.14); }
  .bubble-user.pending { width: min(650px, 100%); background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); padding: 13px; border-radius: 22px 22px 7px 22px; box-shadow: 0 14px 34px rgba(24,54,45,.10); }
  .bubble-user textarea { display: block; width: 100%; resize: none; border: 0; outline: 0; background: transparent; color: inherit; font-size: 15px; line-height: 1.5; padding: 2px 4px; }
  .pending-hint { color: var(--muted); font-size: 10px; padding: 2px 4px 8px; }
  .pending-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 9px; }
  .pending-actions button { min-height: 34px; border: 0; border-radius: 999px; padding: 0 14px; font-size: 10.5px; font-weight: 800; }
  .pending-actions .send-btn { background: var(--forest); color: #fff; }
  .pending-actions .cancel-btn2 { background: var(--paper); color: var(--muted); }

  .card-agent {
    width: 100%; max-width: none;
    border: 1px solid var(--line);
    border-radius: 27px;
    background: var(--surface);
    padding: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 0 18px 45px rgba(24,54,45,.08);
  }
  .answer-body { padding: 25px 24px 4px; }
  .answer-confidence { margin:16px 24px 0; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .answer-lead { color: var(--forest); font-size: 19px; line-height: 1.45; font-weight: 800; }
  .answer-detail { margin-top: 12px; color: var(--ink); font-size: 15px; line-height: 1.67; white-space: pre-wrap; }
  .answer-text { color: var(--ink); font-size: 16px; line-height: 1.67; white-space: pre-wrap; }
  .source-list { margin: 17px 24px 0; display: grid; gap: 8px; }
  .source-item { padding: 11px 13px; border: 1px solid var(--line); border-radius: 13px; background: var(--mint-soft); display: flex; justify-content: space-between; gap: 12px; align-items: center; color: var(--forest); font-size: 10.5px; line-height: 1.4; text-decoration: none; }
  .source-item span:last-child { color: var(--muted); text-align: right; }
  .source-line { margin: 18px 24px 0; padding: 11px 13px; border-radius: 14px; background: var(--mint-soft); color: #426656; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
  .source-line::before { content: "✓"; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface); color: var(--leaf); font-size: 10px; }
  .confidence { width: fit-content; display: flex; align-items: flex-start; gap: 7px; border-radius: 999px; padding: 7px 10px; font-size: 9.5px; line-height: 1.2; font-weight: 800; }
  .confidence .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; margin-top: 3px; }
  .confidence.tier1 { background: var(--mint-soft); color: #3b7255; }
  .confidence.tier1 .dot { background: var(--leaf); }
  .confidence.tier2 { background: var(--sun-soft); color: #89621e; }
  .confidence.tier2 .dot { background: #b98324; }
  .confidence.tier3 { background: var(--blue-soft); color: #466b85; }
  .confidence.tier3 .dot { background: var(--blue); }
  .gap-note { margin: 13px 24px 0; padding: 12px 14px; border-left: 3px solid var(--sun); background: #fbf4df; color: #6f5a2d; font-size: 11px; line-height: 1.5; }
  .service-disclaimer { margin: 15px 24px 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; color: var(--forest); background: var(--surface-2); font-size: 11px; font-weight: 800; line-height: 1.4; }
  .artifact { margin: 17px 24px 0; border: 0; border-radius: 18px; background: var(--forest); color: #fff; padding: 17px 18px; display: grid; grid-template-columns: 145px 1fr; gap: 16px; }
  .artifact-heading { color: #b9d4c5; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .13em; line-height: 1.4; }
  .checklist { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px 13px; }

  .composer-tool{flex:none;min-height:44px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:#52665e;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 11px;font-size:10.5px;font-weight:800;white-space:nowrap}.composer-tool:hover{border-color:var(--line-strong);background:var(--mint-soft);color:var(--forest)}.composer-tool.active{border-color:var(--forest);background:var(--forest);color:#fff}.composer-tool svg{width:16px;height:16px}.upload-button{width:44px;padding:0}.attachment-tray{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:0 2px 1px;scrollbar-width:none}.attachment-tray::-webkit-scrollbar{display:none}.attachment-chip{flex:none;max-width:240px;min-height:32px!important;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);color:var(--ink);padding:4px 5px 4px 10px;display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:700}.attachment-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.attachment-chip button{width:24px;height:24px;min-height:24px;border:0;border-radius:50%;background:transparent;color:var(--muted)}.attachment-chip button:hover{background:var(--paper-deep);color:var(--ink)}.attachment-note{color:var(--muted);font-size:9px;line-height:1.35;padding:0 5px 1px}

er:1px solid var(--forest);border-radius:999px;background:var(--forest);color:#fff;padding:0 18px;font-size:10.5px;font-weight:800}

  /* ---------- Easy mode: a separate low-complexity application ---------- */

  const expansions = ACRONYM_EXPANSIONS[language] || ACRONYM_EXPANSIONS.en;
  for (const [acronym, expansion] of Object.entries(expansions)) {
    const escapedAcronym = acronym.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    if (new RegExp(`\\(${escapedAcronym}\\)`, "i").test(value)) continue;
    const full = expansion.replace(new RegExp(`\\s*\\(${escapedAcronym}\\)$`, "i"), "");
    if (value.toLocaleLowerCase().includes(full.toLocaleLowerCase())) continue;
    const pattern = new RegExp(`\\b${escapedAcronym}\\b`, "i");
    value = value.replace(pattern, expansion);
  }
  return value;
}

function applySessionPerspective(text) {
  let value = String(text || "");
  if (state.helping !== "other") return value;
  if (state.lang === "hi") {
    return value.replace(/आपकी/g, "लाभार्थी की").replace(/आपके/g, "लाभार्थी के").replace(/आपका/g, "लाभार्थी का").replace(/आपको/g, "लाभार्थी को").replace(/आप\b/g, "लाभार्थी");
  }
  return value.replace(/\byourself\b/gi, "the beneficiary").replace(/\byour\b/gi, "the beneficiary's").replace(/\byou\b/gi, "they");
}

// Every session has a real Firebase identity. Visitors start with Firebase

let startingGuest = false;
onAuthStateChanged(auth, async (user) => {
  if (historyUnsubscribe) { historyUnsubscribe(); historyUnsubscribe = null; }
  if (!user && !startingGuest) {
    startingGuest = true;
    try { await signInAnonymously(auth); }
    catch (error) {
      state.authChecked = true;
      state.authError = "Could not start a secure guest session: " + (error.message || String(error));
      render();
    } finally { startingGuest = false; }
    return;
  }
  state.authChecked = true;
  state.user = user;
  state.workerMode = false;
  state.accountProfile = null;
  state.sessionScript = null;
  state.sessionPlayed = [];
  clearSessionExperience();
  if (user) {
    subscribeHistory();
    if (!user.isAnonymous) await loadAccountSettings(user);
  }
  render();
});

async function loadAccountSettings(user) {
  try {
    const snapshot = await getDoc(doc(db, "users", user.uid));
    const stored = snapshot.exists() ? snapshot.data() : {};
    const seeded = seededAccountForEmail(user.email);
    applySessionScript(user);
    state.workerMode = stored.workerMode === true;
    state.accountProfile = {
      displayName: stored.displayName || user.displayName || seeded?.displayName || user.email,
      title: stored.title || seeded?.title || "",
    };
  } catch (error) {
    console.error("account settings load failed", error);
    const seeded = seededAccountForEmail(user.email);
    state.accountProfile = { displayName: user.displayName || seeded?.displayName || user.email, title: seeded?.title || "" };
    applySessionScript(user);
  }
}

// Accounts with a script in lib/sessionScripts.js open in the language and at
// the reading level that script is written for.
function applySessionScript(user) {
  const script = sessionScriptForEmail(user?.email);
  state.sessionScript = script;
  state.sessionPlayed = [];
  applySessionExperience(script);
  if (script && state.lang !== script.language) setPreferences({ language: script.language });
}

async function apiHeaders() {

// Every user-facing failure string in this app is deliberately calm and
// generic, which means the browser console is the only place the real cause
// is ever visible. Log what the server actually said: HTTP status, the error
// code from the JSON body, and any thrown message. Note the guarded .json()
// at each call site — a Vercel platform failure returns a plain-text body, so
// an unguarded .json() threw a parse error and destroyed the status code
// before it could be logged. That is what made a 500 indistinguishable from
// an offline device for several rounds of debugging.
function logApiFailure(scope, { res, data, error } = {}) {
  const parts = [`[api:${scope}]`];
  if (res) parts.push(`HTTP ${res.status}${res.statusText ? " " + res.statusText : ""}`);
  if (data && data.error) parts.push(`error=${data.error}`);
  if (error) parts.push(`thrown=${error.message || error}`);
  console.error(parts.join(" "));
  if (error && error.stack) console.error(error.stack);
}

// ---------- RENDER ROOT ----------
function render() {
  const previousMain = root.querySelector("main");
  const previousSidebar = root.querySelector(".sidebar-scroll");
  const previousScrollTop = previousMain?.scrollTop || 0;
  const previousSidebarScrollTop = previousSidebar?.scrollTop || 0;
  const wasNearBottom = !previousMain || previousMain.scrollHeight - previousMain.scrollTop - previousMain.clientHeight < 96;
  const sameView = lastRenderedView === state.view;
  const conversationKey = `${state.sessionId}:${state.messages.length}:${state.stage}:${state.awaitingDetails}`;
  const conversationChanged = conversationKey !== lastConversationRenderKey;
  if (disposeAuthPreferences) { disposeAuthPreferences(); disposeAuthPreferences = null; }
  root.innerHTML = "";
  if (!state.authChecked || !state.user) return renderSplash();
  renderApp();
  const nextMain = root.querySelector("main");
  const nextSidebar = root.querySelector(".sidebar-scroll");
  requestAnimationFrame(() => {
    if (nextSidebar) nextSidebar.scrollTop = previousSidebarScrollTop;
    if (!nextMain) return;
    if (state.view === "conversation" && conversationChanged && wasNearBottom) nextMain.scrollTop = nextMain.scrollHeight;
    else if (sameView) nextMain.scrollTop = previousScrollTop;
  });
  lastRenderedView = state.view;
  lastConversationRenderKey = conversationKey;
}

async function loadVoiceOptions() {
  if (state.voiceLoading || !state.user) return;
  state.voiceLoading = true;
  render();
  try {
    const response = await fetch("/api/speak", { method: "POST", headers: await apiHeaders(), body: JSON.stringify({ action: "voices", lang: state.lang }) });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || data.provider !== "google-cloud-tts" || !Array.isArray(data.voices)) {
      logApiFailure("speak:voices", { res: response, data });
      throw new Error(data.error || "voice_list_failed");
    }
    state.voiceOptions = data.voices;
    if (!state.voiceOptions.some((voice) => voice.name === state.voiceName)) state.voiceName = data.defaultVoice || state.voiceOptions[0]?.name || null;
    if (state.voiceName) writeVoicePreference(state.lang, state.voiceName);
    state.error = null;
  } catch (error) {
    console.error("Voice list failed", error);
    state.error = state.lang === "hi" ? "आवाज़ें नहीं मिल सकीं।" : "Voices could not be loaded.";
  } finally {
    state.voiceLoading = false;
    render();
  }
}

function groupHistoryBySession() {
  const bySession = new Map();
  for (const h of state.history) {
    const sid = h.sessionId || "legacy";
    if (!bySession.has(sid)) bySession.set(sid, []);
    bySession.get(sid).push(h);
  }
  const sessions = [];
  for (const [id, turns] of bySession) {
    turns.sort((a, b) => toMillis(a.createdAt) - toMillis(b.createdAt));
    const latest = Math.max(...turns.map(t => toMillis(t.createdAt)));
    sessions.push({ id, turns, firstQuestion: turns[0].question, turnCount: turns.length, latest, relativeTime: relativeTime(latest) });
  }
  sessions.sort((a, b) => b.latest - a.latest);
  return sessions;
}

function toMillis(v) {
  if (!v) return 0;
  if (typeof v === "number") return v;
  if (v.toMillis) return v.toMillis();
  if (v.seconds) return v.seconds * 1000;
  return 0;
}

function relativeTime(ms) {
  const diff = Date.now() - ms;
  const mins = Math.round(diff / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.round(hrs / 24)}d ago`;
}

function loadSession(sessionId) {
  const sessions = groupHistoryBySession();
  const session = sessions.find(s => s.id === sessionId);
  if (!session) return;
  state.sessionId = sessionId;
  state.messages = [];
  state.currentCaseId = state.workerMode ? (session.turns[0]?.caseId || sessionId) : null;
  state.currentCaseLabel = state.workerMode ? (session.turns[0]?.caseLabel || "") : "";
  session.turns.forEach(turn => {
    state.messages.push({ role: "user", text: turn.question });
    state.messages.push({
      role: "agent", text: turn.answer, question: turn.question,
      tier: turn.tier, tierLabel: turn.tierLabel, gap: turn.gap || null, sources: turn.sources || [], disclaimer: turn.disclaimer || DISCLAIMER[state.lang] || DISCLAIMER.en,
      artifact: Array.isArray(turn.documentsNeeded) && turn.documentsNeeded.length ? { heading: "Document checklist", items: turn.documentsNeeded } : null,
      chips: [],
      replayed: true,
    });
  });
  state.view = "conversation";
  state.sidebarOpen = false;
  render();
}

    inner.appendChild(b);
  }
  if (state.error) {
    const b = document.createElement("div"); b.className = "error-banner"; b.textContent = state.error;
    inner.appendChild(b);
  }

  state.messages.forEach((m, i) => inner.appendChild(buildMessageEl(m, i)));
  if (state.stage === "thinking") inner.appendChild(buildSkeletonCard());

  return main;
}

function buildSkeletonCard() {
  const row = document.createElement("div");
  row.className = "row agent";
  row.innerHTML = `
    <div class="card-agent">
      <div class="answer-body skeleton-card"><div class="skel-line w90"></div><div class="skel-line w60"></div><div class="skel-line w40"></div></div>
    </div>`;
  return row;
}

function buildMessageEl(m, index) {
  const row = document.createElement("div");
  if (m.role === "user") {
    row.className = "row user";
    if (m.pending) {
      row.innerHTML = `
        <div class="user-turn">
          <div class="turn-meta"><i></i> Check what Aadya heard</div>
          <div class="bubble-user pending">
            <div class="pending-hint">Correct a name or word before sending. You do not need to record again.</div>
            <textarea id="pending-edit" rows="2">${escapeHtml(m.text)}</textarea>
            <div class="pending-actions">
              <button class="cancel-btn2" id="pending-cancel">Discard</button>
              <button class="send-btn" id="pending-send">Use this transcript</button>
            </div>
          </div>
        </div>`;
      setTimeout(() => {
        const cancel = row.querySelector("#pending-cancel");
        const send = row.querySelector("#pending-send");
        const textarea = row.querySelector("#pending-edit");
        if (cancel) cancel.onclick = () => { state.messages.splice(index, 1); state.stage = "idle"; render(); };
        if (send) send.onclick = () => { if (textarea.value.trim()) runPipelineWithText(textarea.value.trim()); };
        if (textarea) {
          textarea.focus();
          textarea.setSelectionRange(textarea.value.length, textarea.value.length);
          textarea.onkeydown = (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && textarea.value.trim()) runPipelineWithText(textarea.value.trim());
          };
        }
      });
    } else {
      row.innerHTML = `<div class="user-turn"><div class="bubble-user">${escapeHtml(m.text)}</div>${m.attachments?.length ? `<div class="attachment-tray">${m.attachments.map(file=>`<div class="attachment-chip"><span>${escapeHtml(file.name)}</span></div>`).join("")}</div>` : ""}</div>`;
    }
    return row;
  }

  row.className = "row agent";
  const tierClass = m.tier === 1 ? "tier1" : m.tier === 2 ? "tier2" : m.tier === 3 ? "tier3" : "";
  const englishTierLabel = ENGLISH_TIER_LABELS[m.tier];
  const answerParts = splitFirstSentence(explainAcronyms(m.text));
  const card = document.createElement("article");
  card.className = "card-agent";
  card.innerHTML = `
    <div class="answer-body">
      <div class="answer-lead">${escapeHtml(answerParts.lead)}</div>
      ${answerParts.detail ? `<div class="answer-detail">${escapeHtml(answerParts.detail)}</div>` : ""}
    </div>
    ${renderSources(m.sources || [])}
    ${m.tierLabel ? `<div class="answer-confidence"><div class="confidence ${tierClass}"><span class="dot"></span>${dualBlock(m.tierLabel, englishTierLabel)}</div>${m.private ? `<span class="private-badge">${state.lang === "hi" ? "निजी" : "Private"}</span>` : ""}</div>` : ""}
    ${m.gap ? `<div class="gap-note">${escapeHtml(m.gap)}</div>` : ""}
    ${m.artifact ? renderArtifact(m.artifact) : ""}
    <div class="service-disclaimer">${escapeHtml(m.disclaimer || DISCLAIMER[state.lang] || DISCLAIMER.en)}</div>
    <div class="card-footer-row">
      ${(() => {
        const isThis = state.audio.key === `msg-${index}` && state.audio.el;
        if (isThis && !state.audio.paused) {
          return `<button class="icon-text-btn" data-pause="${index}">
            <svg viewBox="0 0 20 20" fill="currentColor"><rect x="5" y="4" width="3.5" height="12" rx="1"/><rect x="11.5" y="4" width="3.5" height="12" rx="1"/></svg>
            Pause audio</button>`;
        }
        if (isThis && state.audio.paused) {
          return `<button class="icon-text-btn" data-pause="${index}">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M4 3.5v13l11-6.5-11-6.5z"/></svg>
            Resume audio</button>`;
        }
        return `<button class="icon-text-btn" data-replay="${index}">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M4 3.5v13l11-6.5-11-6.5z"/></svg>
          Hear answer</button>`;
      })()}
      <button class="icon-text-btn" data-copy="${index}">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="7" width="9" height="9" rx="1.5"/><path d="M4 13V4h9"/></svg>
        Copy answer
      </button>
      <button class="icon-text-btn ${state.helping === "other" ? "worker-action" : ""}" data-share="${index}">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="15" cy="4" r="2"/><circle cx="5" cy="10" r="2"/><circle cx="15" cy="16" r="2"/><path d="m7 9 6-4M7 11l6 4"/></svg>
        Share
      </button>
      ${(() => {
        // Scripted turns only offer these once the turn actually carries
        // authored artifacts; otherwise clicking them would fall through to
        // the real, billed /api/artifact call mid-scripted-session.
        if (m.tier === "refuse") return "";
        if (m.scripted && !sessionTurnById(state.sessionScript, m.scriptTurnId)?.artifacts) return "";
        return `<button class="icon-text-btn draft-action" data-build-artifact="application" data-message-index="${index}">${state.lang === "hi" ? "आवेदन ड्राफ़्ट" : "Draft application"}</button><button class="icon-text-btn draft-action" data-build-artifact="checklist" data-message-index="${index}">${state.lang === "hi" ? "तैयारी सूची" : "Build checklist"}</button>`;
      })()}
      ${state.workerMode ? `<button class="icon-text-btn worker-action" data-whatsapp="${index}">WhatsApp-ready</button><button class="icon-text-btn worker-action" data-print="${index}">Print</button><button class="icon-text-btn report-button" data-report="${index}">Report a wrong answer</button>` : ""}
      <button class="icon-text-btn danger" data-delete-answer="${index}">${state.lang === "hi" ? "यह जवाब मिटाएँ" : "Delete answer"}</button>
      ${state.user?.isAnonymous ? `<button class="icon-text-btn" data-sign-in="${index}">Sign in to keep answers</button>` : ""}
    </div>
    ${m.chips && m.chips.length ? `<div class="chip-row">${m.chips.map(c => `<button class="chip" data-chip="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join("")}</div>` : ""}
  `;
  row.appendChild(card);

  setTimeout(() => {
    const replay = row.querySelector("[data-replay]");
    if (replay) replay.onclick = () => speak(m.text, state.lang, null, `msg-${index}`);
    const pause = row.querySelector("[data-pause]");
    if (pause) pause.onclick = togglePauseAudio;
    const copy = row.querySelector("[data-copy]");
    if (copy) copy.onclick = () => {
      navigator.clipboard?.writeText(buildStandaloneText(m)).then(() => showToast("Complete answer copied"));
    };
    const share = row.querySelector("[data-share]");
    if (share) share.onclick = async () => {
      const text = buildStandaloneText(m);
      try {
        if (navigator.share) await navigator.share({ title: "Aadya answer", text });
        else { await navigator.clipboard.writeText(text); showToast("Sharing is unavailable; complete answer copied"); }
      } catch (error) { if (error?.name !== "AbortError") showToast("Could not share this answer"); }
    };
    const signIn = row.querySelector("[data-sign-in]");
    if (signIn) signIn.onclick = () => { state.showAuthModal = true; state.authMode = "signin"; state.authError = null; render(); };
    const deleteAnswer = row.querySelector("[data-delete-answer]");
    if (deleteAnswer) deleteAnswer.onclick = () => deleteOneAnswer(m, index);
    const whatsApp = row.querySelector("[data-whatsapp]");
    if (whatsApp) whatsApp.onclick = () => window.open(`https://wa.me/?text=${encodeURIComponent(buildStandaloneText(m))}`, "_blank", "noopener");
    const printButton = row.querySelector("[data-print]");
    if (printButton) printButton.onclick = () => printStandaloneAnswer(m);
    const reportButton = row.querySelector("[data-report]");
    if (reportButton) reportButton.onclick = () => reportWrongAnswer(m);
    row.querySelectorAll("[data-build-artifact]").forEach(button => { button.onclick = () => createWorkspaceArtifact(button.dataset.buildArtifact, m); });
    row.querySelectorAll("[data-chip]").forEach(btn => { btn.onclick = () => handleFollowupChip(btn.dataset.chip, m); });
  });

  return row;
}

function renderArtifact(artifact) {
  return `
    <div class="artifact">
      <div class="artifact-heading">${escapeHtml(artifact.heading)}</div>
      <div class="checklist">
        ${artifact.items.map(it => `<div class="checklist-item"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10l4 4 8-8"/></svg>${escapeHtml(explainAcronyms(it))}</div>`).join("")}
      </div>
    </div>`;
}

function renderSources(sources) {
  if (!sources.length) return "";
  return `<div class="source-list" aria-label="Sources">${sources.map((source) => `
    <a class="source-item" href="${escapeHtml(source.url || "#")}" target="_blank" rel="noopener noreferrer">
      <span>${escapeHtml(explainAcronyms(source.name || "Source"))}</span>
      <span>${source.reviewedOn ? `${state.lang === "hi" ? "जाँच" : "Checked"} ${escapeHtml(source.reviewedOn)}` : ""} ↗</span>
    </a>`).join("")}</div>`;
}

function splitFirstSentence(text) {
  const value = String(text || "").trim();
  const match = value.match(/^(.+?[.!?।])(?:\s+|$)([\s\S]*)$/);
  return match ? { lead: match[1].trim(), detail: match[2].trim() } : { lead: value, detail: "" };
}

function buildStandaloneText(message) {
  const lines = [
    `${state.lang === "hi" ? "सवाल" : "Question"}: ${explainAcronyms(message.question || "")}`,
    `${state.lang === "hi" ? "जवाब" : "Answer"}: ${explainAcronyms(message.text || "")}`,
  ];
  if (message.tierLabel) lines.push(`${state.lang === "hi" ? "सावधानी" : "Caveat"}: ${message.tierLabel}`);
  if (message.gap) lines.push(message.gap);
  if (message.artifact?.items?.length) lines.push(`${state.lang === "hi" ? "दस्तावेज़ सूची" : "Checklist"}:\n- ${message.artifact.items.map((item) => explainAcronyms(item)).join("\n- ")}`);
  for (const source of message.sources || []) {
    lines.push(`${state.lang === "hi" ? "स्रोत" : "Source"}: ${source.name || ""}${source.reviewedOn ? ` · ${state.lang === "hi" ? "जाँच" : "checked"} ${source.reviewedOn}` : ""}\n${source.url || ""}`);
  }
  lines.push(message.disclaimer || DISCLAIMER[state.lang] || DISCLAIMER.en);
  return lines.filter(Boolean).join("\n\n");
}

function renderArtifactWorkspace() {
  if (!state.artifactOpen) {
    if (!state.workspaceArtifacts.length) return "";
    return `<button class="artifact-tab" id="artifact-tab" aria-label="Open drafts workspace">${state.lang === "hi" ? "ड्राफ़्ट" : "Drafts"}<b>${state.workspaceArtifacts.length}</b></button>`;
  }
  const artifact = state.workspaceArtifacts.find((item) => item.id === state.activeArtifactId) || state.workspaceArtifacts.at(-1) || null;
  const kindLabel = artifact?.kind === "application" ? (state.lang === "hi" ? "आवेदन ड्राफ़्ट" : "Application draft") : (state.lang === "hi" ? "तैयारी सूची" : "Preparation checklist");
  const body = state.artifactBusy ? `<div class="workspace-loading"><div class="workspace-loading-card"><div class="skel-line w40"></div><div class="skel-line w90"></div><div class="skel-line w60"></div><div class="skel-line w90"></div></div></div>`
    : state.artifactError ? `<div class="workspace-empty"><div><b>${state.lang === "hi" ? "ड्राफ़्ट नहीं बन सका" : "The draft could not be built"}</b><br>${escapeHtml(state.artifactError)}</div></div>`
    : artifact ? `<div class="workspace-document"><h2>${escapeHtml(artifact.title)}</h2>${artifact.subtitle ? `<div class="workspace-subtitle">${escapeHtml(artifact.subtitle)}</div>` : ""}${(artifact.sections || []).map(section=>`<section class="workspace-section"><h3>${escapeHtml(section.heading)}</h3>${section.body ? `<p>${escapeHtml(section.body)}</p>` : ""}${section.items?.length ? `<ul>${section.items.map(item=>`<li>${escapeHtml(item)}</li>`).join("")}</ul>` : ""}</section>`).join("")}${artifact.missingInformation?.length ? `<aside class="workspace-missing"><b>${state.lang === "hi" ? "पूरा करने से पहले जोड़ें" : "Add before using this draft"}</b><ul>${artifact.missingInformation.map(item=>`<li>${escapeHtml(item)}</li>`).join("")}</ul></aside>` : ""}<div class="workspace-caveat">${escapeHtml(artifact.caveat || "Confirm every detail at the official source before submitting.")}</div></div>`
    : `<div class="workspace-empty">${state.lang === "hi" ? "जवाब से आवेदन या सूची बनाएँ।" : "Build an application or checklist from any answer."}</div>`;
  return `<aside class="artifact-workspace ${state.artifactExpanded ? "expanded" : ""}" aria-label="Draft workspace">
    <div class="workspace-head"><div class="workspace-title"><small>${kindLabel}</small><strong>${escapeHtml(artifact?.title || (state.artifactBusy ? (state.lang === "hi" ? "ड्राफ़्ट बना रहा हूँ…" : "Building your draft…") : "Aadya workspace"))}</strong></div><div class="workspace-controls">
      <button class="workspace-icon-btn" id="artifact-expand" aria-label="${state.artifactExpanded ? "Use compact width" : "Expand workspace"}" title="${state.artifactExpanded ? "Compact" : "Expand"}"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3H3v4M13 3h4v4M7 17H3v-4M13 17h4v-4"/></svg></button>
      <button class="workspace-icon-btn" id="artifact-collapse" aria-label="Collapse workspace" title="Collapse"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 5-5 5 5 5"/></svg></button>
    </div></div>
    ${state.workspaceArtifacts.length > 1 ? `<div class="workspace-tabs">${state.workspaceArtifacts.map((item,index)=>`<button class="workspace-tab ${item.id === artifact?.id ? "active" : ""}" data-artifact-id="${escapeHtml(item.id)}">${index+1} · ${item.kind === "application" ? "Application" : "Checklist"}</button>`).join("")}</div>` : ""}
    <div class="workspace-body">${body}</div>
    ${artifact && !state.artifactBusy ? `<div class="workspace-actions"><button class="workspace-action primary" id="artifact-copy">Copy</button><button class="workspace-action" id="artifact-download">Download .txt</button><button class="workspace-action" id="artifact-print">Print</button><button class="workspace-action danger" id="artifact-delete">Delete draft</button></div>` : ""}
  </aside>`;
}

function wireArtifactWorkspace() {
  const tab = document.getElementById("artifact-tab");
  if (tab) tab.onclick = () => { state.artifactOpen = true; render(); };
  const collapse = document.getElementById("artifact-collapse");
  if (!collapse) return;
  collapse.onclick = () => { state.artifactOpen = false; state.artifactExpanded = false; render(); };
  document.getElementById("artifact-expand").onclick = () => { state.artifactExpanded = !state.artifactExpanded; render(); };
  document.querySelectorAll("[data-artifact-id]").forEach(button => { button.onclick = () => { state.activeArtifactId = button.dataset.artifactId; render(); }; });
  const artifact = state.workspaceArtifacts.find((item) => item.id === state.activeArtifactId) || state.workspaceArtifacts.at(-1);
  if (!artifact) return;
  document.getElementById("artifact-copy")?.addEventListener("click",()=>navigator.clipboard.writeText(workspaceArtifactText(artifact)).then(()=>showToast("Draft copied")));
  document.getElementById("artifact-download")?.addEventListener("click",()=>downloadWorkspaceArtifact(artifact));
  document.getElementById("artifact-print")?.addEventListener("click",()=>printWorkspaceArtifact(artifact));
  document.getElementById("artifact-delete")?.addEventListener("click",()=>{
    state.workspaceArtifacts=state.workspaceArtifacts.filter(item=>item.id!==artifact.id);
    state.activeArtifactId=state.workspaceArtifacts.at(-1)?.id||null;
    state.artifactOpen=Boolean(state.workspaceArtifacts.length);
    render();
  });
}

function workspaceArtifactText(artifact) {
  const lines=[artifact.title,artifact.subtitle];
  for (const section of artifact.sections || []) {
    lines.push(section.heading);
    if (section.body) lines.push(section.body);
    if (section.items?.length) lines.push(section.items.map(item=>`- ${item}`).join("\n"));
  }
  if (artifact.missingInformation?.length) lines.push(`Add before using this draft:\n- ${artifact.missingInformation.join("\n- ")}`);
  lines.push(artifact.caveat,"Not a government service. This information is free.");
  return lines.filter(Boolean).join("\n\n");
}

function downloadWorkspaceArtifact(artifact) {
  const url=URL.createObjectURL(new Blob([workspaceArtifactText(artifact)],{type:"text/plain;charset=utf-8"}));
  const link=document.createElement("a");link.href=url;link.download=`aadya-${artifact.kind}-${new Date().toISOString().slice(0,10)}.txt`;link.click();URL.revokeObjectURL(url);
}

function printWorkspaceArtifact(artifact) {
  const popup=window.open("","_blank");
  if(!popup){showToast("Allow pop-ups to print this draft");return;}
  popup.document.write(`<!doctype html><html><head><title>${escapeHtml(artifact.title)}</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 24px;white-space:pre-wrap;line-height:1.6;color:#17352d}</style></head><body>${escapeHtml(workspaceArtifactText(artifact))}</body></html>`);popup.document.close();popup.focus();popup.print();
}

function demoWorkspaceArtifact(kind,message) {
  const isApplication=kind==="application";
  const hindi=state.lang==="hi";
  return {id:`artifact_${Date.now()}`,kind,title:isApplication?(hindi?"आवेदन की तैयारी का ड्राफ़्ट":"Application preparation draft"):(hindi?"आवेदन तैयारी सूची":"Application readiness checklist"),subtitle:`${hindi?"इस सवाल से तैयार":"Prepared from"}: ${message.question}`,sections:isApplication?[{heading:hindi?"अनुरोध":"Request",body:message.text,items:[]},{heading:hindi?"आवेदक की जानकारी":"Applicant details",body:hindi?"[पूरा नाम, पता, राज्य, उम्र और संपर्क विवरण आधिकारिक दस्तावेज़ों के अनुसार जोड़ें।]":"[Add full name, address, state, age and contact details exactly as they appear on official documents.]",items:[]},{heading:hindi?"सहायक जानकारी":"Supporting information",body:hindi?"[आधिकारिक फ़ॉर्म में माँगी गई जानकारी जोड़ें। पासवर्ड, एक बार इस्तेमाल होने वाला पासवर्ड या बैंक पिन न लिखें।]":"[Add the facts requested on the official form. Do not include passwords, one-time passwords or bank PINs.]",items:[]}]:[{heading:hindi?"क्या पुष्टि करें":"What to confirm",body:"",items:[message.text]},{heading:hindi?"कौन से दस्तावेज़ तैयार करें":"Documents to prepare",body:"",items:message.artifact?.items?.length?message.artifact.items:[hindi?"आधिकारिक स्रोत खोलकर मौजूदा दस्तावेज़ सूची जाँचें।":"Open the official source and check the current document list."]},{heading:hindi?"अगला कदम":"Next action",body:hindi?"आधिकारिक लिंक पर प्रक्रिया की पुष्टि करें और सरकारी सेवा के माध्यम से आवेदन करें।":"Use the official link below to confirm the route and submit through the government service.",items:(message.sources||[]).map(source=>`${source.name}: ${source.url}`)}],missingInformation:hindi?["आवेदक का नाम और संपर्क विवरण","वर्तमान राज्य और जिला","आधिकारिक फ़ॉर्म में माँगी गई बाकी जानकारी"]:["Applicant name and contact details","Current state and district","Any fields required by the official form"],caveat:hindi?"यह केवल तैयारी का ड्राफ़्ट है, जमा किया हुआ आवेदन नहीं। हर जानकारी की पुष्टि आधिकारिक स्रोत पर करें।":"This is a preparation draft, not a submitted application. Confirm every field at the official source."};
}

async function createWorkspaceArtifact(kind,message) {
  if(state.artifactBusy)return;
  state.artifactOpen=true;state.artifactBusy=true;state.artifactError=null;render();
  try{
    const scripted=message.scriptTurnId?sessionArtifact(state.sessionScript,message.scriptTurnId,kind):null;
    const artifact=scripted?(await sleep(DEMO_DELAYS.thinking),scripted):state.demo?demoWorkspaceArtifact(kind,message):await (async()=>{
      const response=await fetch("/api/artifact",{method:"POST",headers:await apiHeaders(),body:JSON.stringify({kind,language:state.lang,question:message.question,answer:message.text,sources:(message.sources||[]).map(({name,url,reviewedOn})=>({name,url,reviewedOn})),existingChecklist:message.artifact?.items||[],attachments:(message.attachments||[]).map(({name,type,size,text})=>({name,type,size,text}))})});
      const data=await response.json().catch(()=>({}));if(!response.ok){logApiFailure("artifact",{res:response,data});throw new Error(data.error||"artifact_failed");}return data.artifact;
    })();
    state.workspaceArtifacts.push(artifact);state.activeArtifactId=artifact.id;
  }catch(error){state.artifactError=error.message==="artifact_failed"?"Please try again in a moment.":String(error.message||error);}
  finally{state.artifactBusy=false;render();}
}

function printStandaloneAnswer(message) {
  const popup = window.open("", "_blank");
  if (!popup) { showToast("Allow pop-ups to print this answer"); return; }
  const text = buildStandaloneText(message);
  popup.document.write(`<!doctype html><html><head><title>Aadya answer</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 24px;white-space:pre-wrap;line-height:1.55;color:#222}</style></head><body>${escapeHtml(text)}</body></html>`);
  popup.document.close();
  popup.focus();
  popup.print();
}

async function reportWrongAnswer(message) {
  try {
    await addDoc(collection(db, "corrections"), {
      uid: state.user.uid,
      sourceIds: (message.sources || []).map((source) => source.id).filter(Boolean),
      tier: message.tier || null,
      language: state.lang,
      caseId: state.workerMode ? state.currentCaseId : null,
      status: "open",
      createdAt: serverTimestamp(),
    });
    showToast("Added to the correction queue");
  } catch (error) {
    showToast("Could not report this answer");
  }
}

function handleFollowupChip(label, sourceMessage) {
  // Scripted chips are already phrased as questions — send them verbatim.
  if (sourceMessage.scripted) { runPipelineWithText(label); return; }
  const kind = label === (DOC_LABEL[state.lang] || DOC_LABEL.en) ? "docs" : label === (SIMPLER_LABEL[state.lang] || SIMPLER_LABEL.en) ? "simpler" : "help";
  runPipelineWithText(t(FOLLOWUPS[kind]) + sourceMessage.question);
}

async function handleAttachmentSelection(fileList) {
  const files = Array.from(fileList || []);
  const allowed = new Set(["text/plain","text/markdown","text/csv","application/json","application/pdf","image/png","image/jpeg"]);
  const textTypes = new Set(["text/plain","text/markdown","text/csv","application/json"]);
  const next = [];
  for (const file of files) {
    if (state.attachments.length + next.length >= 3) { showToast("You can attach up to 3 files"); break; }
    if (file.size > 5 * 1024 * 1024) { showToast(`${file.name} is larger than 5 MB`); continue; }
    const inferredType = file.type || ({txt:"text/plain",md:"text/markdown",csv:"text/csv",json:"application/json",pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg"}[file.name.split(".").pop()?.toLowerCase()] || "");
    if (!allowed.has(inferredType)) { showToast(`${file.name} is not a supported file type`); continue; }
    let text = "";
    if (textTypes.has(inferredType)) {
      try { text = (await file.text()).slice(0, 12000); }
      catch { showToast(`Could not read ${file.name}`); continue; }
    }
    next.push({ name:file.name.slice(0,120), type:inferredType, size:file.size, text });
  }
  state.attachments.push(...next);
  render();
}

function formatTimer(s) { const m = Math.floor(s / 60); const r = s % 60; return `${m}:${String(r).padStart(2, "0")}`; }

// ---------- Recording ----------
async function getMicrophoneStream(timeoutMs = 8000) {
  if (!navigator.mediaDevices?.getUserMedia) {
    throw new Error("microphone_unavailable");
  }
  let expired = false;
  let timeoutId;
  const request = navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
    if (expired) {
      stream.getTracks().forEach((track) => track.stop());
      throw new Error("microphone_timeout");
    }
    return stream;
  });
  try {
    return await Promise.race([
      request,
      new Promise((_, reject) => {
        timeoutId = setTimeout(() => {
          expired = true;
          reject(new Error("microphone_timeout"));
        }, timeoutMs);
      }),
    ]);
  } finally {
    clearTimeout(timeoutId);
  }
}

async function startRecording() {
  if (state.stage !== "idle") return;
  state.error = null;
  state.stage = "requestingMic";
  render();

  // Demo mode: never touch the microphone (the flakiest part of a live demo).
  // Walk a scripted queue instead — one entry is deliberately misheard so the
  // editable-transcript correction flow can be shown on camera.
  if (state.demo) {
    state.stage = "listening"; state.listenSeconds = 0;
    state.listenTimer = setInterval(() => { state.listenSeconds++; updateTimerOnly(); }, 1000);
    render();
    await new Promise((resolve) => {
      state.demoStopResolve = resolve;
      state.autoStopTimer = setTimeout(resolve, MAX_RECORDING_SECONDS * 1000);
    });
    state.demoStopResolve = null;
    clearInterval(state.listenTimer);
    clearTimeout(state.autoStopTimer);
    if (state.cancelledRecording) { state.cancelledRecording = false; state.stage = "idle"; render(); return; }
    state.stage = "transcribing"; render();
    await sleep(DEMO_DELAYS.transcribing);
    const demoQueue = DEMO_SUGGESTIONS_LOCALIZED[state.lang] || DEMO_SUGGESTIONS;
    const entry = { transcript: demoQueue[state.demoMicIndex % Math.min(3, demoQueue.length)] };
    state.demoMicIndex++;
    state.stage = "idle";
    runPipelineWithText(entry.transcript, false, true);
    return;
  }

  try {
    const stream = await getMicrophoneStream();
    const mr = new MediaRecorder(stream);
    state.chunks = [];
    mr.ondataavailable = (e) => state.chunks.push(e.data);
    mr.onstop = () => handleRecordingStop(stream);
    mr.start();
    state.mediaRecorder = mr;
    state.autoStopTimer = setTimeout(() => { if (mr.state === "recording") mr.stop(); }, MAX_RECORDING_SECONDS * 1000);
    state.stage = "listening";
    state.listenSeconds = 0;
    state.listenTimer = setInterval(() => { state.listenSeconds++; updateTimerOnly(); }, 1000);
    render();
  } catch (e) {
    if (e?.message === "microphone_timeout") {
      state.error = state.lang === "hi"
        ? "माइक्रोफ़ोन नहीं खुला। ब्राउज़र की माइक्रोफ़ोन अनुमति जाँचें और फिर कोशिश करें।"
        : "The microphone did not open. Check this browser's microphone permission and try again.";
    } else if (e?.message === "microphone_unavailable" || e?.name === "NotFoundError") {
      state.error = state.lang === "hi" ? "इस डिवाइस पर माइक्रोफ़ोन उपलब्ध नहीं है।" : "No microphone is available on this device.";
    } else {
      state.error = state.lang === "hi"
        ? "माइक्रोफ़ोन की अनुमति नहीं मिली। ब्राउज़र सेटिंग में अनुमति दें।"
        : "Microphone permission was denied. Please allow mic access in your browser settings.";
    }
    state.stage = "idle";
    render();
  }
}

function updateTimerOnly() {
  const el = document.querySelector(".timer");
  if (el) el.textContent = formatTimer(state.listenSeconds);
}

function finishDemoRecording() {
  state.demoStopResolve?.();
}

function cancelListening() {
  clearInterval(state.listenTimer);
  clearTimeout(state.autoStopTimer);
  state.mediaRecorder?.stream?.getTracks?.().forEach(t => t.stop());
  try { state.mediaRecorder?.stop(); } catch (e) {}
  state.mediaRecorder = null;
  state.stage = "idle";
  state.cancelledRecording = true;
  state.demoStopResolve?.();
  state.demoStopResolve = null;
  render();
}

async function handleRecordingStop(stream) {
  clearInterval(state.listenTimer);
  clearTimeout(state.autoStopTimer);
  stream.getTracks().forEach(t => t.stop());
  if (state.cancelledRecording) { state.cancelledRecording = false; return; }

  const blob = new Blob(state.chunks, { type: "audio/webm" });
  if (blob.size < 500) {
    state.error = "No speech detected. Please try again, a bit closer to the mic.";
    state.stage = "idle"; render();
    return;
  }
  if (state.offline || !navigator.onLine) {
    state.error = "You're offline. This recording was not saved. Reconnect and record again.";
    state.stage = "idle"; render();
    return;
  }

  state.stage = "transcribing"; render();
  try {
    const audioBase64 = await blobToBase64(blob);
    const res = await fetch("/api/transcribe", { method: "POST", headers: await apiHeaders(), body: JSON.stringify({ audioBase64, mimeType: "audio/webm", language: state.lang }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      logApiFailure("transcribe", { res, data });
      throw new Error(data.error || "transcription_failed");
    }
    state.stage = "idle";
    runPipelineWithText(data.text, false, true);
  } catch (e) {
    logApiFailure("transcribe", { error: e });
    state.error = "Could not reach the transcription service. Check your connection and try again.";
    state.stage = "idle"; render();
  }
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// ---------- Pipeline ----------
function questionNeedsState(text) {
  return /\b(?:state|pension|ration|housing|pmay|scholarship|amount|top[- ]?up|district)\b|(?:राज्य|पेंशन|राशन|आवास|छात्रवृत्ति|राशि|जिला)/iu.test(String(text || ""));
}

async function runPipelineWithText(text, detailsConfirmed = false, fromVoice = false) {
  if (!text || ["requestingMic", "transcribing", "thinking"].includes(state.stage)) return;
  const needsOtherDetails = state.helping === "other" && (!state.sessionState || state.beneficiaryAge === null);
  if (!detailsConfirmed && (needsOtherDetails || (questionNeedsState(text) && !state.sessionState))) {
    state.pendingQuestion = text;
    state.pendingWasVoice = fromVoice;
    state.awaitingDetails = true;
    state.stage = "idle";
    render();
    return;
  }
  const privateAsk = state.privateNext;
  state.privateNext = false;
  const turnAttachments = state.attachments.map((file) => ({ ...file }));
  state.attachments = [];
  if (state.workerMode && !state.currentCaseId) {
    state.currentCaseId = `case_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
    state.sessionId = state.currentCaseId;
  }
  const pendingIdx = state.messages.findIndex(m => m.pending);
  if (pendingIdx !== -1) state.messages[pendingIdx] = { role: "user", text, private: privateAsk, attachments: turnAttachments };
  else state.messages.push({ role: "user", text, private: privateAsk, attachments: turnAttachments });
  state.stage = "thinking"; state.error = null; render();

  // Seeded-account sessions follow lib/sessionScripts.js. Only a question that
  // matches a scripted turn is served from the script; anything else falls
  // through to the live pipeline below, so the session never dead-ends.
  const scriptedTurn = matchSessionTurn(state.sessionScript, text, state.sessionPlayed);
  if (scriptedTurn) {
    await sleep(DEMO_DELAYS.thinking);
    state.sessionPlayed.push(scriptedTurn.id);
    const data = { ...scriptedTurn.response, scripted: true, scriptTurnId: scriptedTurn.id };
    appendAgentMessage(text, data, privateAsk, turnAttachments);
    if (!privateAsk) await saveHistory(text, data);
    finishAnswer(data.answer, fromVoice);
    return;
  }

  // Demo mode: no model calls at all — scripted fixture with a staged delay.
  if (state.demo) {
    await sleep(DEMO_DELAYS.thinking);
    const data = localizeDemoResponse(matchDemoResponse(text), state.lang);
    appendAgentMessage(text, data, privateAsk, turnAttachments);
    if (!privateAsk) await saveHistory(text, data);
    finishAnswer(data.answer, fromVoice);
    return;
  }

  const turnStart = Date.now();
  let auditRecord = { uid: state.user?.uid || "anon", sessionId: state.sessionId, language: state.lang, inputLength: text.length, inputChannel: "voice-or-text", createdAt: serverTimestamp() };

  try {
    const guardRes = await fetch("/api/guard-input", { method: "POST", headers: await apiHeaders(), body: JSON.stringify({ text }) });
    const guardData = await guardRes.json().catch(() => ({}));
    if (!guardRes.ok) logApiFailure("guard-input", { res: guardRes, data: guardData });
    auditRecord.inputGuardVerdict = String(guardData.score ?? "");

    if (guardData.flagged) {
      const refusalText = REFUSAL_TEXT[state.lang] || REFUSAL_TEXT.en;
      state.messages.push({ role: "agent", text: refusalText, question: text, tier: "refuse", tierLabel: null, chips: [] });
      auditRecord.spoken = false; auditRecord.refused = true;
      if (!privateAsk) await logAudit(auditRecord, turnStart);
      finishAnswer(refusalText, fromVoice);
      return;
    }

    const ansRes = await fetch("/api/answer", { method: "POST", headers: await apiHeaders(), body: JSON.stringify({ question: text, language: state.lang, perspective: state.helping || "self", state: state.sessionState, beneficiaryAge: state.beneficiaryAge }) });
    const data = await ansRes.json().catch(() => ({}));
    if (!ansRes.ok) {
      logApiFailure("answer", { res: ansRes, data });
      throw new Error(data.error || "answer_failed");
    }

    appendAgentMessage(text, data, privateAsk, turnAttachments);

    auditRecord.retrievedDocIds = data.retrievedDocIds || [];
    auditRecord.retrievalScore = data.confidence;
    auditRecord.outputLength = String(data.answer || "").length;
    auditRecord.outputGuardVerdict = data.guardVerdict || null;
    auditRecord.spoken = state.autoplay || fromVoice;
    auditRecord.tier = data.tier;
    auditRecord.timings = data.timings || {};

    if (!privateAsk) {
      await logAudit(auditRecord, turnStart);
      await saveHistory(text, data);
      if (data.tier === 3) await recordUnanswered(text);
    }

    finishAnswer(data.answer, fromVoice);
  } catch (e) {
    logApiFailure("answer", { error: e });
    state.attachments = turnAttachments;
    state.error = "Something went wrong reaching the answer service. Please try again.";
    state.stage = "idle";
    auditRecord.error = String(e.message || e);
    if (!privateAsk) logAudit(auditRecord, turnStart).catch(() => {});
    render();
  }
}

function finishAnswer(answer, fromVoice = false) {
  // Autoplay remains off by default for typed/loaded content. Speaking a
  // response to an explicit voice turn is part of that one-tap interaction.
  if (!state.autoplay && !fromVoice) { state.stage = "idle"; render(); return; }
  state.stage = "speaking"; render();
  speak(explainAcronyms(applySessionPerspective(answer)), state.lang, () => { state.stage = "idle"; render(); }, `msg-${state.messages.length - 1}`);
}

// ---------- speak() — Google Cloud TTS only (WaveNet preferred by the API).
// Provider or playback failures remain visible; the app never substitutes a
// device voice that sounds different across browsers. ----------
async function speak(text, lang, onDone, key = "live") {
  stopAudio();
  try {
    const res = await fetch("/api/speak", { method: "POST", headers: await apiHeaders(), body: JSON.stringify({ text, lang, speakingRate: state.speechRate, voiceName: state.voiceName }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      logApiFailure("speak", { res, data });
      throw new Error(data.error || "tts_failed");
    }
    if (data.provider !== "google-cloud-tts" || !data.audioBase64) throw new Error("invalid_google_tts_response");
    state.voiceName = data.voice;
    writeVoicePreference(lang, data.voice);

    const binary = atob(data.audioBase64);
    const bytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
    const audioUrl = URL.createObjectURL(new Blob([bytes], { type: "audio/mpeg" }));
    const audio = new Audio(audioUrl);
    state.audio = { el: audio, key, paused: false, url: audioUrl };
    audio.onended = () => {
      URL.revokeObjectURL(audioUrl);
      state.audio = { el: null, key: null, paused: false, url: null };
      render();
      onDone && onDone();
    };
    audio.onerror = () => {
      URL.revokeObjectURL(audioUrl);
      state.audio = { el: null, key: null, paused: false, url: null };
      state.stage = "idle";
      state.error = state.lang === "hi" ? "Google Cloud की आवाज़ नहीं चल सकी। फिर कोशिश करें।" : "Google Cloud voice could not play. Please try again.";
      render();
      onDone && onDone();
    };
    try {
      await audio.play();
    } catch (playbackError) {
      // Browsers may block media playback after the async answer/TTS round
      // trip. Keep the Google MP3 loaded so a direct Resume tap can play it.
      state.audio.paused = true;
      state.stage = "idle";
      state.error = state.lang === "hi" ? "Google Cloud की आवाज़ तैयार है। सुनने के लिए Resume audio दबाएँ।" : "Google Cloud voice is ready. Tap Resume audio to hear it.";
      render();
      onDone && onDone();
      return;
    }
    state.error = null;
    render();
  } catch (e) {
    logApiFailure("speak", { error: e });
    state.stage = "idle";
    state.error = state.lang === "hi" ? "Google Cloud की आवाज़ उपलब्ध नहीं है। उत्तर पढ़ने के लिए खुला रहेगा।" : "Google Cloud voice is unavailable. The answer remains available to read.";
    render();
    onDone && onDone();
  }
}

// Fully stops and releases the Google audio Blob. Called on navigation,
// sign-out, new chat, tab hide and page unload.
function stopAudio() {
  if (state.audio.el) {
    try {
      state.audio.el.onended = null;
      state.audio.el.onerror = null;
      state.audio.el.pause();
      state.audio.el.currentTime = 0;
      state.audio.el.src = "";
    } catch (e) {}
  }
  if (state.audio.url) URL.revokeObjectURL(state.audio.url);
  state.audio = { el: null, key: null, paused: false, url: null };
}

async function togglePauseAudio() {
  const { el, paused } = state.audio;
  if (!el) return;
  if (paused) {
    try {
      await el.play();
      state.audio.paused = false;
      state.error = null;
    } catch (error) {
      state.error = state.lang === "hi" ? "Google Cloud की आवाज़ चलाने की अनुमति नहीं मिली।" : "This browser did not allow Google Cloud audio playback.";
    }
  }
  else { el.pause(); state.audio.paused = true; }
  render();
}

window.addEventListener("pagehide", stopAudio);
window.addEventListener("beforeunload", stopAudio);
document.addEventListener("visibilitychange", () => { if (document.hidden) stopAudio(); });

// ---------- Firestore / localStorage: audit + history ----------
async function deleteOneAnswer(message, index) {
  if (!window.confirm(state.lang === "hi" ? "यह सवाल और जवाब मिटाएँ?" : "Delete this question and answer?")) return;
  if (!message.private) {
    const snapshot = await getDocs(query(collection(db, "history"), where("uid", "==", state.user.uid)));
    const matches = snapshot.docs.filter((entry) => {
      const value = entry.data();
      return value.sessionId === state.sessionId && value.question === message.question;
    });
    await Promise.all(matches.map((entry) => deleteDoc(entry.ref)));
  }
  const start = index > 0 && state.messages[index - 1]?.role === "user" ? index - 1 : index;
  state.messages.splice(start, index - start + 1);
  render();
}

async function deleteCollectionForUser(name) {
  const snapshot = await getDocs(query(collection(db, name), where("uid", "==", state.user.uid)));
  const groups = [];
  for (let index = 0; index < snapshot.docs.length; index += 450) groups.push(snapshot.docs.slice(index, index + 450));
  for (const group of groups) {
    const batch = writeBatch(db);
    group.forEach((entry) => batch.delete(entry.ref));
    await batch.commit();
  }
}

async function deleteAllHistory(skipConfirmation = false) {
  if (!skipConfirmation && !window.confirm(state.lang === "hi" ? "सारी सहेजी हुई हिस्ट्री हमेशा के लिए मिटाएँ?" : "Permanently delete all saved history?")) return;
  try {
    await deleteCollectionForUser("history");
    state.history = [];
    resetSession();
    state.view = "conversation";
    state.showAccountMenu = false;
    showToast(state.lang === "hi" ? "हिस्ट्री मिटा दी गई" : "History deleted");
  } catch (error) {
    state.error = "Could not delete history. Please try again.";
    render();
  }
}

async function deleteWholeAccount() {
  if (!window.confirm(state.lang === "hi" ? "खाता और उससे जुड़ा सारा डेटा हमेशा के लिए मिटाएँ?" : "Permanently delete this account and all of its data?")) return;
  const current = auth.currentUser;
  try {
    for (const name of ["history", "audit", "corrections"]) await deleteCollectionForUser(name);
    await deleteDoc(doc(db, "users", current.uid)).catch(() => {});
    await deleteUser(current);
    state.messages = [];
    state.history = [];
    state.showAccountMenu = false;
  } catch (error) {
    state.error = error?.code === "auth/requires-recent-login"
      ? "For safety, sign in again and then delete the account."
      : "Could not delete the account. Please try again.";
    render();
  }
}

async function logAudit(record, turnStart) {
  try { await addDoc(collection(db, "audit"), { uid: state.user.uid, ...record, totalLatencyMs: Date.now() - turnStart }); }
  catch (e) { console.error("audit log failed", e); }
}

async function saveHistory(question, answer) {
  const entry = { question, answer: answer.answer, sources: answer.sources || [], tier: answer.tier, tierLabel: answer.tierLabel, gap: answer.gap || null, documentsNeeded: answer.documentsNeeded || [], disclaimer: answer.disclaimer || DISCLAIMER[state.lang] || DISCLAIMER.en, language: state.lang, sessionId: state.sessionId, caseId: state.workerMode ? state.currentCaseId : null, caseLabel: state.workerMode ? state.currentCaseLabel : null, createdAt: Date.now() };
  try { await addDoc(collection(db, "history"), { uid: state.user.uid, ...entry, createdAt: serverTimestamp() }); }
  catch (e) { console.error("history save failed", e); }
}

async function clearCurrentCase() {
  if (!state.currentCaseId || !window.confirm("Clear this case and its saved answers?")) return;
  try {
    const snapshot = await getDocs(query(collection(db, "history"), where("uid", "==", state.user.uid)));
    await Promise.all(snapshot.docs.filter((entry) => entry.data().caseId === state.currentCaseId).map((entry) => deleteDoc(entry.ref)));
    resetSession(); render();
  } catch (error) { showToast("Could not clear this case"); }
}

async function questionFingerprint(text) {
  const bytes = new TextEncoder().encode(String(text || "").normalize("NFKC").trim().toLowerCase());
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return [...new Uint8Array(digest)].map((value) => value.toString(16).padStart(2, "0")).join("");
}

async function recordUnanswered(question) {
  try {
    const hash = await questionFingerprint(question);
    const ref = doc(db, "unanswered", hash);
    await runTransaction(db, async (transaction) => {
      const snapshot = await transaction.get(ref);
      if (snapshot.exists()) transaction.update(ref, { count: increment(1), updatedAt: serverTimestamp() });
      else transaction.set(ref, { hash, language: state.lang, count: 1, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
    });
  } catch (error) { console.error("unanswered aggregate failed", error); }
}

async function exportUnansweredSummary() {
  try {
    const snapshot = await getDocs(collection(db, "unanswered"));
    const rows = [["question_fingerprint", "language", "count"], ...snapshot.docs.map((entry) => {
      const value = entry.data(); return [value.hash || entry.id, value.language || "", value.count || 0];
    })];
    const csv = rows.map((row) => row.map((value) => `"${String(value).replaceAll('"', '""')}"`).join(",")).join("\n");
    const url = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    const link = document.createElement("a"); link.href = url; link.download = "aadya-unanswered-summary.csv"; link.click(); URL.revokeObjectURL(url);
  } catch (error) { showToast("Could not export the unanswered summary"); }
}

function subscribeHistory() {
  // A single-field UID query works with Firestore's automatic index; sorting
  // and the 200-row cap happen locally, avoiding a missing composite index.
  const q = query(collection(db, "history"), where("uid", "==", state.user.uid));
  historyUnsubscribe = onSnapshot(q, (snap) => {
    state.history = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => toMillis(b.createdAt) - toMillis(a.createdAt)).slice(0, 200);
    if (state.view === "history" || document.getElementById("sidebar")) render();
  });
}

// Builds the agent message from an /api/answer-shaped payload. Shared by the
// live pipeline and demo mode so both render through identical code paths —
// demo must be visually indistinguishable from the real app.
function appendAgentMessage(question, data, privateAsk = false, attachments = []) {
  const chips = (data.tier === "refuse" || data.scripted) ? (data.chips || []) : [];
  const sources = Array.isArray(data.sources) ? data.sources : [];
  // Shown for tier 1 and 2 — documentsNeeded comes from the prototype corpus,
  // not model output, so it's equally trustworthy on a partial answer; the
  // tier label already carries the "confirm the rest" caveat.
  const artifact = ((data.tier === 1 || data.tier === 2) && Array.isArray(data.documentsNeeded) && data.documentsNeeded.length)
    ? { heading: "Document checklist", items: data.documentsNeeded } : null;
  state.messages.push({ role: "agent", text: explainAcronyms(applySessionPerspective(data.answer)), question, tier: data.tier, tierLabel: data.tierLabel, gap: data.gap, sources, disclaimer: data.disclaimer || DISCLAIMER[state.lang] || DISCLAIMER.en, chips, artifact, private: privateAsk, attachments, scripted: data.scripted === true, scriptTurnId: data.scriptTurnId || null });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

let toastTimer = null;
function showToast(message) {
  state.toast = message;
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { state.toast = null; render(); }, 1800);
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

render();
</script>
